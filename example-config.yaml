# Example photobook configuration

# Path to directory containing photos
# Can be relative or absolute
#photos: /mnt/pictures/2026/2026-04-30+ Hamburg
photos: /mnt/pictures/2026/Test

# Output configuration
output:
  # Paper size: A4, Letter, or custom dimensions
  size: A4
  
  # Output format: pdf, png, or jpg
  format: pdf
  
  # Output filename (optional - defaults to config filename)
  filename: /mnt/downloads/my-photobook.pdf
  
  # Output directory (optional - defaults to current directory)
  # directory: ./output/

# Layout configuration
# Specify EITHER photos_per_page OR pages (not both)
layout:
  # Fixed number of photos per page
  photos_per_page: 3
  
  # OR: Fixed total number of pages
  # pages: 8
  
  # Photo ordering (optional)
  # order: alphabetical  # alphabetical (default) or date

  # Start a new page whenever a photo/title is from a new calendar day
  # (optional, default true). With a fixed `pages` count, set to false to
  # go back to filling pages purely by photo count, ignoring dates.
  # new_page_per_day: true

# Theme selection
# Available: clean, classic, modern
# Or path to custom theme file
theme: clean2

text_labels:
  # 'title' entries get their own page slot (like a photo) instead of being
  # overlaid on the nearest photo - use them for section/chapter headings.
  - timestamp: "2026-04-30T10:00:00"
    title: |
      # **Hamburg**

      30. April 2026
  - timestamp: "2026-04-30T12:23:00"
    text: "## Ladepause"
  - timestamp: "2026-04-30T14:02:00"
    text: "Es geht los"
  - timestamp: "2026-04-30T14:04:00"
    text: "**Hamburger** Spendenparlament"
