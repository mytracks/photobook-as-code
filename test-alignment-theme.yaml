name: Test Right Align
description: Test theme with right-aligned text to demonstrate background fix
background: {color: '#FFFFFF'}
borders:
  enabled: true
  width: 2
  color: '#CCCCCC'
  shadow: false
spacing: 
  page_margin: 90
  photo_margin: 20
text:
  font_family: DejaVuSansMono
  base_font_size: 40
  text_color: "#000000"
  text_background_enabled: true
  text_background_color: "#E0E0E0"
  text_background_opacity: 80
  text_padding: 16
layouts:
# 2 Photos
- count: 2
  photos:
  - orientation: landscape
    position: {x: 0.5, y: 0.25}
    size: {width: 1.0, height: 0.5}
  - orientation: landscape
    position: {x: 0.5, y: 0.75}
    size: {width: 1.0, height: 0.5}
# 3 Photos with different text alignments
- count: 3
  photos:
  - orientation: landscape
    position: {x: 0.5, y: 0.165}
    size: {width: 1.0, height: 0.33}
    text:
      x: 10
      y: 5
      width: 80
      height: 20
      align: left
      valign: top
  - orientation: landscape
    position: {x: 0.5, y: 0.5}
    size: {width: 1.0, height: 0.33}
    text:
      x: 10
      y: 40
      width: 80
      height: 20
      align: center
      valign: top
  - orientation: landscape
    position: {x: 0.5, y: 0.835}
    size: {width: 1.0, height: 0.33}
    text:
      x: 10
      y: 75
      width: 80
      height: 20
      align: right
      valign: top
